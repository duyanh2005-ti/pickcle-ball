#spring.application.name=demo

# Thông tin nhạy cảm KHÔNG ghi trực tiếp ở đây.
# - Production: đặt biến môi trường DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET.
# - Máy dev: copy config/application-dev.properties.example thành config/application-dev.properties
#   (file này đã được .gitignore). Profile 'dev' được bật mặc định khi không chỉ định profile nào.
spring.profiles.default=dev

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pickleball}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

spring.jpa.hibernate.ddl-auto=none
#spring.jpa.hibernate.ddl-auto = create
#spring.jpa.hibernate.ddl-auto = update
#spring.jpa.hibernate.ddl-auto = create-drop
spring.jpa.show-sql=true
server.port=8082
spring.thymeleaf.encoding=UTF-8
